name: ZwoVulcanBridge
version: '${version}'
main: br.com.serpens.vulcanbridge.ZwoVulcanBridgePlugin
api-version: '1.21'
authors: [Zwo]
description: Filtro de lag para as punições do Vulcan (só deixa o Vulcan punir com conexão STABLE, via PingStateProvider).
softdepend: [Vulcan, floodgate]

commands:
  zwovulcanbridge:
    description: Diagnóstico e administração da ZwoVulcanBridge.
    usage: /zvb [status|jogador|reload]
    aliases: [zvb]

permissions:
  zwovulcanbridge.admin:
    description: Acesso completo (inclui reload).
    default: op
    children:
      zwovulcanbridge.staff: true
      zwovulcanbridge.alerts: true
  zwovulcanbridge.staff:
    description: Ver o diagnóstico da ponte.
    default: op
  zwovulcanbridge.alerts:
    description: Receber os avisos de punições do Vulcan liberadas ou bloqueadas.
    default: op
