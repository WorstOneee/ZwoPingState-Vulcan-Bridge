# =====================================================================
#  ZwoVulcanBridge — filtro de lag para as punições do Vulcan
# =====================================================================
#  Quem pune é o VULCAN (pelos punishment-commands do config do Vulcan).
#  Esta ponte NÃO kicka nem bane ninguém. Ela só deixa passar ou cancela:
#
#   1. O Vulcan atinge o VL máximo de um check e vai punir
#      (VulcanPunishEvent).
#   2. A ponte pergunta ao provedor de conexão (ZwoPingState) o estado do
#      jogador: STABLE, UNSTABLE ou UNKNOWN.
#   3. A punição é CANCELADA se a conexão não for STABLE, se o provedor
#      não estiver disponível, se o jogador for Bedrock ou se ele acabou de
#      teleportar/renascer/trocar de mundo. Lag nunca vira punição.
#   4. Com a conexão STABLE, a punição do Vulcan segue normalmente (só no
#      modo ENFORCE).
#
#  Ban SÓ POR PERFIL: nos punishment-commands do Vulcan use
#      /mpbanperfil %player% <motivo>
#  e NÃO use /mpban, /mptempban, /mpipban ou /ban-ip: o /mpban do ModPanel
#  também bane o último IP. A ponte avisa no console e no /zvb status se
#  encontrar esses comandos no config do Vulcan.
#
#  Use /zvb status para conferir tudo depois de editar.
# =====================================================================

# OBSERVE  = padrão. Bloqueia TODAS as punições do Vulcan e só registra em
#            punicoes.log o que teria passado. Não cancela flags.
# ENFORCE  = o Vulcan pune normalmente quando a conexão está STABLE; com lag
#            (ou sem provedor, Bedrock, proteção) a punição é cancelada.
# Mantenha OBSERVE até revisar o punicoes.log por alguns dias.
mode: OBSERVE

filter:
  # Se houve flag com a conexão UNSTABLE (lag de verdade) há menos que isso, a
  # punição do Vulcan é bloqueada mesmo que a conexão já esteja STABLE: o VL
  # daquele momento foi inflado por lag. 0 = desliga. (Ignorado quando
  # cancel-flags = true, porque aí o lag nem chega a somar VL.)
  recent-lag-seconds: 120
  # Só no modo ENFORCE: ao bloquear uma punição por lag/proteção/Bedrock, zera
  # o VL daquele check no Vulcan. Sem isso, o Vulcan tentaria punir de novo a
  # cada nova flag acima do VL máximo.
  reset-vl-when-blocked: true
  # Só no modo ENFORCE: cancela também as FLAGS do Vulcan enquanto a conexão
  # não estiver STABLE (o VL não sobe por lag).
  # NÃO recomendado: a staff deixa de ver os alertas dessas flags e, muito
  # provavelmente, o Vulcan também deixa de dar setback nelas (não confirmado
  # no teste). Quem forja lag (atrasando o keep-alive) poderia andar livre.
  # Com false, a flag segue inteira no Vulcan; só a PUNIÇÃO é filtrada.
  cancel-flags: false

# Proteções de teleporte, respawn e troca de mundo. Durante a proteção, flag e
# punição são barradas (o Vulcan costuma gerar flags falsas logo após mudanças
# bruscas de posição).
# A proteção de ENTRADA/RECONEXÃO não fica aqui: o ZwoPingState responde
# UNKNOWN logo após o join até ter amostras suficientes, o que já barra as
# punições. Assim a lógica não é duplicada.
protections:
  teleport-seconds: 3
  respawn-seconds: 3
  world-change-seconds: 3

bedrock:
  # Jogadores Bedrock (Geyser/Floodgate) nunca recebem punição automática do
  # Vulcan. As flags deles seguem normais, para a staff ver os alertas.
  exclude-from-punishments: true
  # Prefixos de nome usados pelo Floodgate (caso a API não esteja disponível).
  name-prefixes: ["."]

alerts:
  # Avisar a staff online (permissão zwovulcanbridge.alerts) a cada punição
  # do Vulcan, liberada ou bloqueada. Nunca por flag.
  notify-staff: true
  # Gravar cada punição do Vulcan em plugins/ZwoVulcanBridge/punicoes.log.
  audit-log: true
  # Conferir, ao ligar e no /zvb reload, se o config do Vulcan tem comandos
  # que banem IP e avisar no console. A ponte não altera o config do Vulcan.
  check-vulcan-commands: true
