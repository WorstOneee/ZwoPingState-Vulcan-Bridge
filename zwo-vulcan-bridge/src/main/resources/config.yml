# =====================================================================
#  ZwoVulcanBridge 3 — per-UUID anticheat escalation
# =====================================================================
#  The BRIDGE makes the decision now. Vulcan only detects:
#   - In the Vulcan config, set EVERY check to punishable: false.
#     (If any check still punishes, the bridge cancels the punishment
#     and warns in the console.)
#   - The bridge reads Vulcan's flags (VulcanFlagEvent), which keep
#     arriving with punishable: false.
#
#  An OCCURRENCE only counts when, within evidence.window-seconds:
#   - there are flags from the APPROVED checks below, with VL >= min-vl;
#   - each approved check repeated at least min-flags times;
#   - at least min-families different FAMILIES met that
#     (a single flag, or many from the same check, is never enough);
#   - the connection stayed STABLE the whole time (ZwoPingState). A flag
#     with an UNSTABLE/UNKNOWN connection, or no provider, DISCARDS the
#     sequence;
#   - the connection is checked again right before acting;
#   - the account is a CONFIRMED Java account (Floodgate). Bedrock is
#     excluded. An uncertain account is only logged for review.
#  At most ONE occurrence per session.
#
#  Per-UUID sequence (valid for sequence.validity from the 1st kick):
#   1st occurrence -> kick
#   2nd (another session) -> 2nd kick
#   3rd (another session) -> temporary ban of the PROFILE ONLY via ModPanel
#  A kick only counts if the disconnect is confirmed as caused by the
#  bridge (a cancelled kick, a voluntary quit and a timeout do not count).
#  The ban uses ModPanel 3.1.0+'s ProfileBanApi: it never bans an IP and
#  never runs /mpban, /mptempban or /ban-ip. If ModPanel is missing or
#  outdated, automation is BLOCKED (see /zvb status).
#
#  Run /zvb status after editing and /zvb reload to apply.
# =====================================================================

# OBSERVE = default. Gathers evidence and logs to decisoes.log what it
#           WOULD have done. Does not kick, ban or touch the real history.
# ENFORCE = applies the sequence. Only enable it after reviewing decisoes.log.
mode: OBSERVE

evidence:
  # Time window to gather the flags of one occurrence.
  window-seconds: 120
  # Different families required within the window (minimum 2).
  min-families: 2
  # Approved checks. EMPTY = no occurrence is possible (automation stopped).
  # Key: Vulcan check name ("speed") or name:type ('speed:b', in quotes).
  # Fields:
  #   min-vl:    minimum VL of a flag for it to count (required)
  #   min-flags: how many flags of this check within the window (default 2,
  #              max 32). The bridge keeps only the last min-flags of each
  #              check, so memory per player is fixed.
  #   family:    family (default = check name). Checks in the same family
  #              count as one.
  checks: {}

sequence:
  # History validity, counted from the 1st kick (s, m, h, d, w).
  validity: 7d
  # Duration of the 3rd-occurrence temporary ban (capped by ModPanel's
  # limits.max-tempban-days).
  ban-duration: 24h
  ban-reason: 'Uso de trapaça detectado pelo anticheat (3ª ocorrência)'
  # Name shown in ModPanel's history as who applied the ban.
  actor: 'ZwoVulcanBridge'
  # No answer from ModPanel within this time = uncertain result (goes to
  # review; the bridge does not try another ban).
  ban-timeout-seconds: 30

# Messages shown to the kicked player.
messages:
  kick-1: "&cVocê foi desconectado pelo anticheat.\n&7Comportamento irregular detectado. Se acontecer de novo, nova desconexão; na terceira vez, ban temporário."
  kick-2: "&cVocê foi desconectado pelo anticheat pela 2ª vez.\n&7Na próxima ocorrência você será banido temporariamente."

# Protections: flags during a protection do not count, and the action is
# cancelled if a protection is active at the moment of acting.
# JOIN protection lives in ZwoPingState: it answers UNKNOWN right after
# joining until it has enough samples, which already discards the flags.
protections:
  teleport-seconds: 3
  respawn-seconds: 3
  world-change-seconds: 3

bedrock:
  # Floodgate name prefixes. Name with a prefix = Bedrock (excluded from
  # automation). A name WITHOUT a prefix proves nothing: Java is only
  # confirmed by the Floodgate API.
  name-prefixes: ["."]
  # Only for servers WITHOUT Geyser/Floodgate: treats every account with no
  # sign of Bedrock as Java. With Geyser on the network, keep it false
  # (without the Floodgate API, Java and Bedrock cannot be told apart
  # safely).
  assume-java-without-floodgate: false

alerts:
  # Notify online staff (permission zwovulcanbridge.alerts) on each decision.
  notify-staff: true
  # Write each decision to plugins/ZwoVulcanBridge/decisoes.log (never per flag).
  audit-log: true
  # On startup and on /zvb reload: warn if Vulcan has punishable checks or
  # commands that ban IPs. The bridge never changes the Vulcan config.
  check-vulcan-config: true
