# =====================================================================
#  ZwoVulcanBridge 3 — escalada do anticheat por UUID
# =====================================================================
#  Quem decide agora é a PONTE. O Vulcan só detecta:
#   - No config do Vulcan, deixe TODOS os checks com punishable: false.
#     (Se algum ainda punir, a ponte cancela a punição e avisa no console.)
#   - A ponte lê as flags do Vulcan (VulcanFlagEvent), que continuam
#     chegando com punishable: false.
#
#  Uma OCORRÊNCIA só vale quando, dentro de evidence.window-seconds:
#   - há flags de checks APROVADOS abaixo, com VL >= min-vl;
#   - cada check aprovado repetiu pelo menos min-flags vezes;
#   - pelo menos min-families FAMÍLIAS diferentes cumpriram isso
#     (uma flag isolada ou várias do mesmo check nunca bastam);
#   - a conexão ficou STABLE o tempo todo (ZwoPingState). Uma flag com a
#     conexão UNSTABLE/UNKNOWN, ou sem provedor, DESCARTA a sequência;
#   - a conexão é conferida de novo logo antes de agir;
#   - a conta é Java CONFIRMADA (Floodgate). Bedrock fica fora. Conta
#     incerta só gera registro para revisão.
#  No máximo UMA ocorrência por sessão.
#
#  Sequência por UUID (vale sequence.validity a partir do 1º kick):
#   1ª ocorrência -> kick
#   2ª (outra sessão) -> 2º kick
#   3ª (outra sessão) -> ban temporário SÓ DO PERFIL pelo ModPanel
#  Um kick só conta se a desconexão for confirmada como resultado da ponte
#  (kick cancelado, saída voluntária e timeout não contam).
#  O ban usa a ProfileBanApi do ModPanel 3.1.0+: nunca bane IP e nunca
#  executa /mpban, /mptempban ou /ban-ip. Se o ModPanel faltar ou for
#  antigo, a automação fica BLOQUEADA (veja /zvb status).
#
#  Use /zvb status depois de editar e /zvb reload para aplicar.
# =====================================================================

# OBSERVE = padrão. Junta as evidências e registra em decisoes.log o que
#           TERIA feito. Não kicka, não bane e não mexe no histórico real.
# ENFORCE = aplica a sequência. Só ligue depois de revisar o decisoes.log.
mode: OBSERVE

evidence:
  # Janela de tempo para juntar as flags de uma ocorrência.
  window-seconds: 120
  # Famílias diferentes exigidas na janela (mínimo 2).
  min-families: 2
  # Checks aprovados. VAZIO = nenhuma ocorrência possível (automação parada).
  # Chave: nome do check do Vulcan ("speed") ou nome:tipo ('speed:b', entre
  # aspas). Campos:
  #   min-vl:    VL mínimo da flag para contar (obrigatório)
  #   min-flags: quantas flags desse check na janela (padrão 2, máximo 32).
  #              A ponte guarda só as últimas min-flags de cada check, então
  #              a memória por jogador é fixa.
  #   family:    família (padrão = nome do check). Checks da mesma família
  #              contam como uma só.
  checks: {}

sequence:
  # Validade do histórico, contada a partir do 1º kick (s, m, h, d, w).
  validity: 7d
  # Duração do ban temporário da 3ª ocorrência (limitada pelo
  # limits.max-tempban-days do ModPanel).
  ban-duration: 24h
  ban-reason: 'Uso de trapaça detectado pelo anticheat (3ª ocorrência)'
  # Nome que aparece no histórico do ModPanel como quem aplicou.
  actor: 'ZwoVulcanBridge'
  # Sem resposta do ModPanel nesse tempo = resultado incerto (vai para
  # revisão; a ponte não tenta outro ban).
  ban-timeout-seconds: 30

messages:
  kick-1: "&cVocê foi desconectado pelo anticheat.\n&7Comportamento irregular detectado. Se acontecer de novo, nova desconexão; na terceira vez, ban temporário."
  kick-2: "&cVocê foi desconectado pelo anticheat pela 2ª vez.\n&7Na próxima ocorrência você será banido temporariamente."

# Proteções: flags durante a proteção não contam, e a ação é cancelada se a
# proteção estiver ativa no momento de agir.
# A proteção de ENTRADA fica no ZwoPingState: ele responde UNKNOWN logo após
# o join até ter amostras suficientes, o que já descarta as flags.
protections:
  teleport-seconds: 3
  respawn-seconds: 3
  world-change-seconds: 3

bedrock:
  # Prefixos de nome do Floodgate. Nome com prefixo = Bedrock (fora da
  # automação). Nome SEM prefixo não prova nada: Java só é confirmado pela
  # API do Floodgate.
  name-prefixes: ["."]
  # Só para servidores SEM Geyser/Floodgate: considera Java toda conta sem
  # sinal de Bedrock. Com Geyser na rede, deixe false (sem a API do
  # Floodgate não dá para separar Java de Bedrock com segurança).
  assume-java-without-floodgate: false

alerts:
  # Avisar a staff online (permissão zwovulcanbridge.alerts) a cada decisão.
  notify-staff: true
  # Gravar cada decisão em plugins/ZwoVulcanBridge/decisoes.log (nunca por flag).
  audit-log: true
  # Ao ligar e no /zvb reload: avisar se o Vulcan tem checks puníveis ou
  # comandos que banem IP. A ponte não altera o config do Vulcan.
  check-vulcan-config: true
