# =====================================================================
#  ZwoPingState — player connection quality
# =====================================================================
#  This plugin NEVER punishes anyone. It only answers, per UUID:
#    STABLE   = enough recent samples, all within the limits.
#    UNSTABLE = a sign of instability (high ping, fluctuating, spikes,
#               unstable server or still recovering).
#    UNKNOWN  = missing data, stale data, Bedrock player or a sampling
#               failure.
#  ZwoVulcanBridge only evaluates Vulcan flags when the answer is STABLE.
#
#  Limitations:
#   - A low ping is NOT proof of cheating.
#   - Paper does not measure packet loss. The value used is
#     Player#getPing(), the latency the server itself computes from
#     keep-alives.
#   - For Bedrock (Geyser), Paper sees Geyser's ping, not the phone's or
#     console's. That is why Bedrock answers UNKNOWN by default.
#
#  Diagnostics: /pingstate <nick>  and  /pingstate stats
# =====================================================================

collector:
  # Each player is sampled once every N ticks (20 ticks = 1 second).
  # Players are split into batches across those ticks: with 100 players
  # and 20 ticks, that is ~5 reads per tick, never 100 at once.
  sample-interval-ticks: 20
  # Fixed budget: maximum players read in a single tick. If there are more
  # players than interval * this value, each one is read less often (and
  # may go stale -> UNKNOWN). 32 * 20 = 640 players per second.
  max-players-per-tick: 32
  # Time budget per tick, in microseconds. If exceeded, the batch stops
  # and resumes on the next tick (shown in /pingstate stats).
  max-micros-per-tick: 1000

window:
  # Size of each player's ring buffer (samples). 20 = ~20 seconds.
  size: 20
  # Minimum valid samples before answering STABLE.
  min-samples: 8

limits:
  # Last sample above this (ms) = high ping.
  max-ping: 250
  # Window average above this (ms) = high ping.
  max-average-ping: 200
  # Fluctuation: average difference between consecutive samples (ms).
  # Note: on Paper 1.21.11, Player#getPing() is already the AVERAGE of the
  # keep-alives of the last 5 s (one keep-alive per second). That smooths
  # out fluctuation: an RTT varying from 20 to 280 ms shows up as ~10-20 ms
  # of difference between consecutive samples. That is why the range limit
  # below also exists.
  max-jitter: 25
  # Fluctuation: window range (highest - lowest sample, in ms).
  max-range: 60
  # A jump between two consecutive samples greater than or equal to this
  # (ms) counts as a spike.
  spike-jump: 80
  # A sample greater than or equal to this (ms) counts as a spike.
  spike-absolute: 400
  # How many spikes are tolerated within the window. 0 = any spike makes
  # the player UNSTABLE until it leaves the window + recovery.
  max-spikes: 0

recovery:
  # After any player instability, the player must stay within the limits
  # for this CONTINUOUS time to return to STABLE. A single good sample
  # does not clear the evaluation.
  player-seconds: 10
  # After any server instability (TPS, MSPT or stall), everyone stays
  # UNSTABLE for this continuous time with no new problems.
  server-seconds: 10

freshness:
  # If a player's last evaluation is older than this, the answer is
  # UNKNOWN (stale data). E.g.: the server stalled and the batch ran late.
  stale-after-seconds: 5
  # If a player goes longer than this without a sample, their window is
  # reset (old data no longer describes the current connection).
  reset-window-after-gap-seconds: 5

join:
  # Right after joining/reconnecting, Paper reports ping 0 until the first
  # keep-alive. During this time, 0 is treated as "no data".
  # Every player starts as UNKNOWN when joining or reconnecting.
  zero-ping-grace-seconds: 20

server:
  # Short TPS (measured by the sampler itself over the last 20 ticks)
  # below this = unstable server.
  min-tps: 18.0
  # Average MSPT of the last 20 ticks (duration Paper reports at the end of
  # each tick) above this = unstable server.
  max-mspt: 50.0
  # A single tick longer than this (ms) = isolated stall.
  # The sampler only updates a global marker; it never iterates players.
  stall-ms: 250

bedrock:
  # true = Bedrock players answer UNKNOWN (BEDROCK_PROXY).
  # ZwoVulcanBridge already excludes Bedrock from punishments; this only
  # keeps the diagnostics accurate.
  report-unknown: true
  # Floodgate name prefixes (used if the Floodgate API is not present).
  name-prefixes: ["."]
